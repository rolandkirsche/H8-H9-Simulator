<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <!-- 7-Segment-"H8" in der LED-Farbe des Frontpanels (Variable led-on in css/app.css) -->
  <defs>
    <polygon id="h" points="15,8 23,0 77,0 85,8 77,16 23,16"/>
    <polygon id="v" points="8,15 16,23 16,77 8,85 0,77 0,23"/>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#18191b"/>
  <rect x="56" y="96" width="400" height="320" rx="24" fill="#0a0a0a"/>
  <g fill="#ff3623" filter="url(#glow)">
    <g transform="translate(86 121) scale(1.5)">
      <use xlink:href="#v"/><use xlink:href="#v" y="80"/>
      <use xlink:href="#v" x="84"/><use xlink:href="#v" x="84" y="80"/>
      <use xlink:href="#h" y="82"/>
    </g>
    <g transform="translate(276 121) scale(1.5)">
      <use xlink:href="#h"/><use xlink:href="#h" y="82"/><use xlink:href="#h" y="164"/>
      <use xlink:href="#v"/><use xlink:href="#v" y="80"/>
      <use xlink:href="#v" x="84"/><use xlink:href="#v" x="84" y="80"/>
    </g>
  </g>
</svg>
